[package]
name = "stock-predictor"
version = "0.1.5"
edition = "2021"

[[bin]]
name = "stock-predictor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
anyhow = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
toml = "0.8"
